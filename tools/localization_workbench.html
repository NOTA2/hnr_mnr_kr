<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localization Workbench</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #171b20;
      --line: #2a3139;
      --muted: #9ca6b3;
      --text: #edf2f7;
      --accent: #75c7b1;
      --accent-2: #ffd27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(circle at top, #18342d, var(--bg) 42%);
      color: var(--text);
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 240px 320px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .col {
      border-right: 1px solid var(--line);
      overflow: hidden;
      min-height: 0;
    }
    .panel {
      padding: 18px;
      min-height: 0;
    }
    .column-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      gap: 12px;
    }
    .scroll-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }
    h1, h2, h3 {
      margin: 0 0 12px;
    }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; }
    .category, .item, .speaker {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .category.active, .item.active, .speaker.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
      background: rgba(117,199,177,0.08);
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid var(--line);
      background: #20262c;
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .primary { border-color: var(--accent); }
    input, textarea, select {
      width: 100%;
      background: #0f1317;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    textarea { min-height: 100px; resize: vertical; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .preview-card {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      padding: 12px;
    }
    .preview-card img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #0b0f13;
      border: 1px solid var(--line);
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      margin-right: 6px;
      border-radius: 999px;
      background: #24313a;
      color: var(--muted);
      font-size: 11px;
    }
    .section {
      margin-bottom: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      padding: 14px;
    }
    .hidden { display: none; }
    .warning { color: var(--accent-2); }
    .small { font-size: 12px; color: var(--muted); }
    .disabled {
      opacity: 0.55;
      pointer-events: none;
    }
    .item-translation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      color: var(--text);
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }
    .status {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .status.ok {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(117,199,177,0.08);
    }
    .status.error {
      border-color: #d27a7a;
      color: #ffd0d0;
      background: rgba(210,122,122,0.08);
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="col panel column-panel">
      <div>
        <h1>카테고리</h1>
        <div class="meta" id="fontInfo"></div>
        <div id="categoryList"></div>
      </div>
      <div class="section">
        <h2>진행 상태</h2>
        <div class="meta" id="progressInfo"></div>
        <label>번역 에이전트 결과 JSON 가져오기
          <input id="translationImportFile" type="file" accept=".json">
        </label>
        <button id="importTranslationBtn">번역 결과 가져오기</button>
        <div class="small" id="autoImportInfo"></div>
        <button id="rebuildBtn">전체 적용 ROM 재빌드</button>
        <div class="small" id="romInfo"></div>
        <div class="small" id="importInfo"></div>
        <div class="status" id="statusInfo">대기 중</div>
      </div>
    </aside>
    <aside class="col panel column-panel">
      <div>
        <h2 id="itemsTitle">항목</h2>
        <div class="small">카테고리별 텍스트/이미지 항목</div>
      </div>
      <div id="itemList" class="scroll-list"></div>
    </aside>
    <main class="panel col">
      <div class="toolbar">
        <button id="saveItemBtn">항목 저장</button>
        <button id="saveSpeakerBtn">토큰 화자 저장</button>
        <button id="saveSpeakerRegistryBtn">화자 목록 저장</button>
        <button id="saveProgressBtn">현재 위치 저장</button>
        <button id="applyDraftBtn" class="primary">에이전트 초안 → 적용 번역</button>
      </div>

      <div id="textEditor" class="section hidden">
        <h2 id="editorTitle">텍스트 항목</h2>
        <div class="meta" id="editorMeta"></div>
        <label>원문
          <textarea id="sourceText" readonly></textarea>
        </label>
        <label>번역문
          <textarea id="translationText"></textarea>
        </label>
        <label>에이전트 초안
          <textarea id="agentDraftText" placeholder="번역 에이전트가 제안한 초안"></textarea>
        </label>
        <label>에이전트 메모
          <textarea id="agentCommentText" placeholder="수동 잠금 항목에는 차선책/설명 메모를 남긴다"></textarea>
        </label>
        <label>
          <input id="manualLockCheckbox" type="checkbox" style="width:auto; margin-right:8px;">
          수동 잠금
        </label>
        <div class="small warning">
          수동 잠금이 켜진 항목은 번역 에이전트가 현재 적용 번역을 덮어쓰면 안 됩니다.
          대신 에이전트 초안과 메모만 갱신해야 합니다.
        </div>
        <label>메모
          <textarea id="notesText"></textarea>
        </label>
        <div class="split">
          <label>진행 상태
            <select id="progressStatus">
              <option value="todo">todo</option>
              <option value="draft">draft</option>
              <option value="review">review</option>
              <option value="done">done</option>
            </select>
          </label>
          <label>검토 상태
            <select id="reviewStatus">
              <option value="unreviewed">unreviewed</option>
              <option value="checked">checked</option>
              <option value="issue">issue</option>
            </select>
          </label>
        </div>
        <div class="section">
          <h3>화자 / 상태 토큰</h3>
          <div id="speakerMeta" class="meta"></div>
          <label>이 토큰에 연결할 화자
            <select id="speakerSelect"></select>
          </label>
          <label>토큰 메모
            <textarea id="speakerNotes"></textarea>
          </label>
          <div class="small">화자 이름은 직접 입력하지 말고, 아래 화자 목록에 등록한 뒤 여기서 선택합니다.</div>
        </div>
        <div class="section">
          <h3>화자 목록 관리</h3>
          <label>등록된 화자
            <select id="speakerRegistrySelect"></select>
          </label>
          <button id="newSpeakerRegistryBtn">새 화자 입력 초기화</button>
          <label>화자 이름
            <input id="registrySpeakerName" placeholder="예: 에드워드 엘릭">
          </label>
          <label>역할/설명
            <input id="registrySpeakerRole" placeholder="예: 주인공 / 군인 / NPC">
          </label>
          <label>화자 메모
            <textarea id="registrySpeakerNotes"></textarea>
          </label>
        </div>
      </div>

      <div id="imageEditor" class="section hidden">
        <h2 id="imageTitle">이미지 항목</h2>
        <div class="meta" id="imageMeta"></div>
        <div class="preview-grid">
          <div class="preview-card">
            <strong>원본 이미지</strong>
            <div class="small" id="sourcePreviewMeta"></div>
            <img id="sourcePreviewImage" alt="원본 이미지 미리보기">
            <div class="toolbar">
              <a id="sourcePreviewLink" class="small" href="#" target="_blank">원본 열기</a>
              <a id="sourceDownloadLink" class="small" href="#" download>원본 다운로드</a>
            </div>
          </div>
          <div class="preview-card">
            <strong>교체 이미지</strong>
            <div class="small" id="replacementPreviewMeta"></div>
            <img id="replacementPreviewImage" alt="교체 이미지 미리보기">
            <div class="toolbar">
              <a id="replacementPreviewLink" class="small" href="#" target="_blank">교체본 열기</a>
              <a id="replacementDownloadLink" class="small" href="#" download>교체본 다운로드</a>
            </div>
          </div>
        </div>
        <label>원본 이미지 경로
          <input id="sourcePreviewPath" placeholder="confirmed_data/... 또는 analysis/...">
        </label>
        <label>교체 이미지 경로
          <input id="replacementPath" placeholder="/절대/경로/edited.png">
        </label>
        <label>수정 이미지 업로드
          <input id="replacementUpload" type="file" accept=".png,.bmp,.gif,.webp,.jpg,.jpeg">
        </label>
        <button id="uploadImageBtn">업로드 후 교체 경로 반영</button>
        <label>비교 메모
          <textarea id="comparisonNotes"></textarea>
        </label>
        <label>이미지 메모
          <textarea id="imageNotes"></textarea>
        </label>
        <label>진행 상태
          <select id="imageProgressStatus">
            <option value="todo">todo</option>
            <option value="candidate_found">candidate_found</option>
            <option value="dumped">dumped</option>
            <option value="edited">edited</option>
            <option value="ready_to_insert">ready_to_insert</option>
          </select>
        </label>
        <div id="imageSubunits" class="meta"></div>
      </div>
    </main>
  </div>

  <script>
    const state = {
      bundle: null,
      categories: [],
      items: [],
      categoryId: null,
      itemId: null,
      speakerRegistry: [],
      speakerMap: new Map(),
    };

    const categoryList = document.getElementById("categoryList");
    const itemList = document.getElementById("itemList");
    const itemsTitle = document.getElementById("itemsTitle");
    const fontInfo = document.getElementById("fontInfo");
    const progressInfo = document.getElementById("progressInfo");
    const romInfo = document.getElementById("romInfo");
    const importInfo = document.getElementById("importInfo");
    const autoImportInfo = document.getElementById("autoImportInfo");
    const translationImportFile = document.getElementById("translationImportFile");

    const textEditor = document.getElementById("textEditor");
    const imageEditor = document.getElementById("imageEditor");
    const editorTitle = document.getElementById("editorTitle");
    const editorMeta = document.getElementById("editorMeta");
    const sourceText = document.getElementById("sourceText");
    const translationText = document.getElementById("translationText");
    const agentDraftText = document.getElementById("agentDraftText");
    const agentCommentText = document.getElementById("agentCommentText");
    const manualLockCheckbox = document.getElementById("manualLockCheckbox");
    const notesText = document.getElementById("notesText");
    const progressStatus = document.getElementById("progressStatus");
    const reviewStatus = document.getElementById("reviewStatus");
    const speakerMeta = document.getElementById("speakerMeta");
    const speakerSelect = document.getElementById("speakerSelect");
    const speakerNotes = document.getElementById("speakerNotes");
    const speakerRegistrySelect = document.getElementById("speakerRegistrySelect");
    const registrySpeakerName = document.getElementById("registrySpeakerName");
    const registrySpeakerRole = document.getElementById("registrySpeakerRole");
    const registrySpeakerNotes = document.getElementById("registrySpeakerNotes");

    const imageTitle = document.getElementById("imageTitle");
    const imageMeta = document.getElementById("imageMeta");
    const sourcePreviewMeta = document.getElementById("sourcePreviewMeta");
    const sourcePreviewImage = document.getElementById("sourcePreviewImage");
    const sourcePreviewLink = document.getElementById("sourcePreviewLink");
    const sourceDownloadLink = document.getElementById("sourceDownloadLink");
    const replacementPreviewMeta = document.getElementById("replacementPreviewMeta");
    const replacementPreviewImage = document.getElementById("replacementPreviewImage");
    const replacementPreviewLink = document.getElementById("replacementPreviewLink");
    const replacementDownloadLink = document.getElementById("replacementDownloadLink");
    const sourcePreviewPath = document.getElementById("sourcePreviewPath");
    const replacementPath = document.getElementById("replacementPath");
    const replacementUpload = document.getElementById("replacementUpload");
    const comparisonNotes = document.getElementById("comparisonNotes");
    const imageNotes = document.getElementById("imageNotes");
    const imageProgressStatus = document.getElementById("imageProgressStatus");
    const imageSubunits = document.getElementById("imageSubunits");
    const rebuildBtn = document.getElementById("rebuildBtn");
    const statusInfo = document.getElementById("statusInfo");

    function setStatus(message, tone = "") {
      statusInfo.textContent = message;
      statusInfo.className = `status${tone ? ` ${tone}` : ""}`;
    }

    async function fetchJson(url, options) {
      if (window.location.protocol === "file:") {
        throw new Error("이 HTML을 file://로 직접 열면 저장/가져오기/ROM 재빌드가 동작하지 않습니다.\npython3 scripts/run_localization_workbench.py 실행 후\nhttp://127.0.0.1:8766 으로 접속해 주세요.");
      }
      const response = await fetch(url, options);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || response.statusText);
      }
      return response.json();
    }

    async function loadBundle() {
      setStatus("작업대 데이터를 불러오는 중...");
      state.bundle = await fetchJson("/bundle");
      state.categories = state.bundle.dataset.categories;
      state.items = state.bundle.dataset.items;
      state.speakerRegistry = state.bundle.speaker_registry || [];
      state.speakerMap = new Map(
        state.bundle.speakers.map((item) => [item.dialogue_state_token, item])
      );
      renderSpeakerRegistryOptions();
      fontInfo.textContent = `active font: ${state.bundle.dataset.active_font.label || "unknown"}`;
      const autoImport = state.bundle.auto_import_summary || { imported_count: 0 };
      if (autoImport.imported_count > 0) {
        autoImportInfo.textContent = `서버 시작 시 자동 병합: ${autoImport.imported_count}개`;
      } else {
        autoImportInfo.textContent = "서버 시작 시 agent_inbox 안의 JSON을 자동 병합합니다.";
      }
      state.categoryId = state.bundle.progress.current_category_id || state.categories[0]?.id;
      renderCategories();
      renderProgress();
      selectCategory(state.categoryId);
      setStatus("작업대 준비 완료", "ok");
    }

    function renderProgress() {
      progressInfo.textContent = `현재 카테고리: ${state.bundle.progress.current_category_id || "-"}`;
      romInfo.textContent = `고정 ROM: ${state.bundle.progress.last_built_rom || state.bundle.dataset.review_rom.fixed_output_path}`;
    }

    function renderSpeakerRegistryOptions(selectedSpeakerId = "") {
      const options = ['<option value="">-- 미지정 --</option>'];
      for (const speaker of state.speakerRegistry) {
        const selected = speaker.speaker_id === selectedSpeakerId ? "selected" : "";
        const role = speaker.speaker_role ? ` / ${speaker.speaker_role}` : "";
        options.push(`<option value="${speaker.speaker_id}" ${selected}>${speaker.speaker_name}${role}</option>`);
      }
      speakerSelect.innerHTML = options.join("");
      speakerRegistrySelect.innerHTML = options.join("");
    }

    function renderCategories() {
      categoryList.innerHTML = "";
      for (const category of state.categories) {
        const div = document.createElement("div");
        div.className = "category" + (category.id === state.categoryId ? " active" : "");
        div.innerHTML = `
          <strong>${category.label}</strong><br>
          <span class="meta">${category.description}</span><br>
          <span class="badge">${category.item_count}개</span>
          <span class="badge">${category.type}</span>
          <span class="badge">${category.build_enabled ? "ROM 가능" : "ROM 없음"}</span>
        `;
        div.onclick = () => selectCategory(category.id);
        categoryList.appendChild(div);
      }
    }

    function selectCategory(categoryId) {
      state.categoryId = categoryId;
      renderCategories();
      const category = state.categories.find((item) => item.id === categoryId);
      rebuildBtn.disabled = false;
      const filtered = state.items.filter((item) => item.category_id === categoryId);
      itemsTitle.textContent = category ? `${category.label} 항목` : "항목";
      itemList.innerHTML = "";
      for (const item of filtered) {
        const div = document.createElement("div");
        div.className = "item" + (item.item_id === state.itemId ? " active" : "");
        div.dataset.itemId = item.item_id;
        const label = item.text || item.label || item.group_id || item.item_id;
        const token = item.dialogue_state_token ? `<span class="badge">${item.dialogue_state_token}</span>` : "";
        const translationPreview = item.category_id === "image_review_units"
          ? (item.replacement_path || item.comparison_notes || "").trim()
          : (item.translation || item.agent_draft || "").trim();
        const translationHtml = translationPreview
          ? `<div class="item-translation">${translationPreview.slice(0, 72)}</div>`
          : `<div class="item-translation meta">번역 없음</div>`;
        div.innerHTML = `
          <strong>${label.slice(0, 36)}</strong><br>
          <span class="meta">${item.source_group || item.expected_text_kind || ""}</span><br>
          ${token}
          <span class="badge">${item.progress_status || "todo"}</span>
          ${translationHtml}
        `;
        div.onclick = () => selectItem(item.item_id);
        itemList.appendChild(div);
      }
      if (filtered.length) {
        selectItem(filtered[0].item_id);
      } else {
        state.itemId = null;
        textEditor.classList.add("hidden");
        imageEditor.classList.add("hidden");
      }
    }

    function selectItem(itemId) {
      state.itemId = itemId;
      const item = state.items.find((entry) => entry.item_id === itemId);
      document.querySelectorAll(".item").forEach((node) => {
        node.classList.toggle("active", node.dataset.itemId === itemId);
      });
      if (!item) return;
      if (item.category_id === "image_review_units") {
        renderImageItem(item);
      } else {
        renderTextItem(item);
      }
    }

    function renderTextItem(item) {
      imageEditor.classList.add("hidden");
      textEditor.classList.remove("hidden");
      editorTitle.textContent = item.group_id ? `${item.group_id} / ${item.item_id}` : item.item_id;
      editorMeta.textContent = `source_group=${item.source_group} / byte_length=${item.byte_length} / rom=${item.rom_address?.toString(16)} / 적용소스=${item.translation_source || "-"}`;
      sourceText.value = item.text || "";
      translationText.value = item.translation || "";
      agentDraftText.value = item.agent_draft || "";
      agentCommentText.value = item.agent_comment || "";
      manualLockCheckbox.checked = Boolean(item.manual_locked);
      notesText.value = item.notes || "";
      progressStatus.value = item.progress_status || "todo";
      reviewStatus.value = item.review_status || "unreviewed";
      const token = item.dialogue_state_token;
      if (token && state.speakerMap.has(token)) {
        const speaker = state.speakerMap.get(token);
        const linkedSpeaker = state.speakerRegistry.find((entry) => entry.speaker_id === speaker.speaker_id);
        speakerMeta.textContent = `dialogue_state_token: ${token}${linkedSpeaker ? ` / 연결 화자: ${linkedSpeaker.speaker_name}` : ""}`;
        renderSpeakerRegistryOptions(speaker.speaker_id || "");
        speakerNotes.value = speaker.notes || "";
      } else {
        speakerMeta.textContent = token ? `dialogue_state_token: ${token}` : "dialogue_state_token 없음";
        renderSpeakerRegistryOptions("");
        speakerNotes.value = "";
      }
    }

    function renderImageItem(item) {
      textEditor.classList.add("hidden");
      imageEditor.classList.remove("hidden");
      imageTitle.textContent = item.label || item.group_id;
      imageMeta.textContent = `${item.expected_text_kind || ""} / 탐색 방식: ${item.recommended_probe_method || ""}`;
      sourcePreviewPath.value = item.source_preview_path || "";
      replacementPath.value = item.replacement_path || "";
      comparisonNotes.value = item.comparison_notes || "";
      imageNotes.value = item.notes || "";
      imageProgressStatus.value = item.progress_status || "todo";
      replacementUpload.value = "";
      renderPreview(
        item.source_preview_path || item.source_download_path || "",
        sourcePreviewImage,
        sourcePreviewMeta,
        sourcePreviewLink,
        sourceDownloadLink,
        "원본 이미지가 아직 연결되지 않았습니다."
      );
      renderPreview(
        item.replacement_path || "",
        replacementPreviewImage,
        replacementPreviewMeta,
        replacementPreviewLink,
        replacementDownloadLink,
        "교체 이미지가 아직 없습니다."
      );
      imageSubunits.innerHTML = (item.subunits || [])
        .map((sub) => `<div><span class="badge">${sub.id}</span>${sub.label} / ${sub.first_action}</div>`)
        .join("");
    }

    function renderPreview(path, imageNode, metaNode, previewLinkNode, downloadLinkNode, emptyMessage) {
      if (!path) {
        imageNode.removeAttribute("src");
        metaNode.textContent = emptyMessage;
        previewLinkNode.style.display = "none";
        downloadLinkNode.style.display = "none";
        return;
      }
      const url = `/workspace-file?path=${encodeURIComponent(path)}`;
      imageNode.src = url;
      metaNode.textContent = path;
      previewLinkNode.href = url;
      downloadLinkNode.href = url;
      previewLinkNode.style.display = "inline";
      downloadLinkNode.style.display = "inline";
    }

    async function saveCurrentItem() {
      setStatus("항목 저장 중...");
      const item = state.items.find((entry) => entry.item_id === state.itemId);
      if (!item) return;
      if (item.category_id === "image_review_units") {
        const payload = {
          item_id: item.item_id,
          source_preview_path: sourcePreviewPath.value,
          source_download_path: sourcePreviewPath.value,
          replacement_path: replacementPath.value,
          comparison_notes: comparisonNotes.value,
          notes: imageNotes.value,
          progress_status: imageProgressStatus.value,
          status: item.status,
        };
        const saved = await fetchJson("/image-item", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        Object.assign(item, saved);
      } else {
        const payload = {
          item_id: item.item_id,
          translation: translationText.value,
          agent_draft: agentDraftText.value,
          agent_comment: agentCommentText.value,
          manual_locked: manualLockCheckbox.checked,
          notes: notesText.value,
          progress_status: progressStatus.value,
          review_status: reviewStatus.value,
        };
        const saved = await fetchJson("/item", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        Object.assign(item, saved);
      }
      setStatus("항목 저장 완료", "ok");
    }

    async function saveSpeaker() {
      setStatus("화자 연결 저장 중...");
      const item = state.items.find((entry) => entry.item_id === state.itemId);
      if (!item || !item.dialogue_state_token) return;
      const payload = {
        dialogue_state_token: item.dialogue_state_token,
        speaker_id: speakerSelect.value,
        notes: speakerNotes.value,
        confirmed: Boolean(speakerSelect.value),
      };
      const saved = await fetchJson("/speaker", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      state.speakerMap.set(saved.dialogue_state_token, saved);
      renderTextItem(item);
      setStatus("화자 연결 저장 완료", "ok");
    }

    function fillSpeakerRegistryForm(speakerId) {
      const speaker = state.speakerRegistry.find((entry) => entry.speaker_id === speakerId);
      if (!speaker) {
        speakerRegistrySelect.value = "";
        registrySpeakerName.value = "";
        registrySpeakerRole.value = "";
        registrySpeakerNotes.value = "";
        return;
      }
      speakerRegistrySelect.value = speaker.speaker_id;
      registrySpeakerName.value = speaker.speaker_name || "";
      registrySpeakerRole.value = speaker.speaker_role || "";
      registrySpeakerNotes.value = speaker.notes || "";
    }

    async function saveSpeakerRegistry() {
      setStatus("화자 목록 저장 중...");
      const payload = {
        speaker_id: speakerRegistrySelect.value,
        speaker_name: registrySpeakerName.value,
        speaker_role: registrySpeakerRole.value,
        notes: registrySpeakerNotes.value,
      };
      const saved = await fetchJson("/speaker-registry", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const index = state.speakerRegistry.findIndex((entry) => entry.speaker_id === saved.speaker_id);
      if (index >= 0) {
        state.speakerRegistry[index] = saved;
      } else {
        state.speakerRegistry.push(saved);
      }
      renderSpeakerRegistryOptions(saved.speaker_id);
      fillSpeakerRegistryForm(saved.speaker_id);
      setStatus("화자 목록 저장 완료", "ok");
    }

    function newSpeakerRegistry() {
      fillSpeakerRegistryForm("");
    }

    async function saveProgress() {
      setStatus("현재 위치 저장 중...");
      const payload = {
        current_category_id: state.categoryId,
        current_item_id: state.itemId,
      };
      state.bundle.progress = await fetchJson("/progress", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      renderProgress();
      setStatus("현재 위치 저장 완료", "ok");
    }

    async function rebuildRom() {
      setStatus("전체 적용 ROM 재빌드 중...");
      await saveCurrentItem();
      await saveProgress();
      const result = await fetchJson("/rebuild", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      romInfo.textContent = `고정 ROM: ${result.rom_path}`;
      setStatus(`재빌드 완료\n${result.rom_path}`, "ok");
    }

    async function importTranslationResults() {
      setStatus("번역 결과 가져오는 중...");
      const file = translationImportFile.files?.[0];
      if (!file) {
        alert("가져올 번역 결과 JSON 파일을 먼저 선택해 주세요.");
        return;
      }
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (const value of bytes) {
        binary += String.fromCharCode(value);
      }
      const contentBase64 = btoa(binary);
      const result = await fetchJson("/import-translation-results", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          filename: file.name,
          content_base64: contentBase64,
        }),
      });
      importInfo.textContent =
        `가져오기 완료: applied=${result.summary.applied_count}, locked_preserved=${result.summary.locked_preserved_count}, unmatched=${result.summary.unmatched_count}`;
      await loadBundle();
      setStatus(`번역 결과 가져오기 완료\n${result.report_path}`, "ok");
    }

    function applyDraftToTranslation() {
      if (!agentDraftText.value) {
        alert("에이전트 초안이 비어 있습니다.");
        return;
      }
      translationText.value = agentDraftText.value;
      manualLockCheckbox.checked = true;
    }

    async function uploadImageReplacement() {
      setStatus("교체 이미지 업로드 중...");
      const item = state.items.find((entry) => entry.item_id === state.itemId);
      const file = replacementUpload.files?.[0];
      if (!item || !file) {
        alert("업로드할 파일을 먼저 선택해 주세요.");
        return;
      }
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (const value of bytes) {
        binary += String.fromCharCode(value);
      }
      const contentBase64 = btoa(binary);
      const saved = await fetchJson("/image-upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          item_id: item.item_id,
          filename: file.name,
          content_base64: contentBase64,
        }),
      });
      Object.assign(item, saved);
      replacementPath.value = saved.replacement_path || "";
      imageProgressStatus.value = saved.progress_status || "edited";
      renderPreview(
        saved.replacement_path || "",
        replacementPreviewImage,
        replacementPreviewMeta,
        replacementPreviewLink,
        replacementDownloadLink,
        "교체 이미지가 아직 없습니다."
      );
      setStatus(`업로드 완료\n${saved.replacement_path}`, "ok");
    }

    document.getElementById("saveItemBtn").onclick = () => saveCurrentItem().catch((error) => setStatus(error.message, "error"));
    document.getElementById("saveSpeakerBtn").onclick = () => saveSpeaker().catch((error) => setStatus(error.message, "error"));
    document.getElementById("saveSpeakerRegistryBtn").onclick = () => saveSpeakerRegistry().catch((error) => setStatus(error.message, "error"));
    document.getElementById("saveProgressBtn").onclick = () => saveProgress().catch((error) => setStatus(error.message, "error"));
    document.getElementById("importTranslationBtn").onclick = () => importTranslationResults().catch((error) => setStatus(error.message, "error"));
    document.getElementById("rebuildBtn").onclick = () => rebuildRom().catch((error) => setStatus(error.message, "error"));
    document.getElementById("applyDraftBtn").onclick = () => applyDraftToTranslation();
    document.getElementById("uploadImageBtn").onclick = () => uploadImageReplacement().catch((error) => setStatus(error.message, "error"));
    document.getElementById("newSpeakerRegistryBtn").onclick = () => newSpeakerRegistry();
    speakerRegistrySelect.onchange = () => fillSpeakerRegistryForm(speakerRegistrySelect.value);

    loadBundle().catch((error) => {
      setStatus(error.message, "error");
      console.error(error);
    });
  </script>
</body>
</html>
